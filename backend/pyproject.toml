[project]
name = "backend"
version = "0.1.0"
description = "Backend de la plataforma de extraccion y mapeo de documentos"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "azure-ai-documentintelligence>=1.0.2",
    "fastapi>=0.141.1",
    "openai>=3.8.0",
    "pydantic-settings>=2.15.0",
    "pyodbc>=5.3.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false
